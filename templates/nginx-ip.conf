# 没有域名时用：直接通过公网 IP 访问（http）
# 同一个 IP 每秒最多 10 个请求（可短时冲到 40 个），防止有人用程序刷接口
limit_req_zone $binary_remote_addr zone=xq_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=xq_conn:10m;
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 100m;
    server_tokens off;
    limit_conn xq_conn 30;
    location /api/ {
        limit_req zone=xq_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
